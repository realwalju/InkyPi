<div class="form-group">
    <label for="textPrompt" class="form-label">Text Prompt:</label>
    <input type="text" id="textPrompt" name="textPrompt" placeholder="Type something..." required class="form-input">
</div>


<!-- Dropdown Options -->
<div class="form-group dropdown-container">
    <!-- Image Model Dropdown -->
    <div class="form-group">
        <label for="imageModel" class="form-label">Image Model:</label>
        <select id="imageModel" name="imageModel" class="form-input" onchange="toggleQualityDropdown()">
            <option value="gpt-image-2.6-flare" selected>GPT Image 2.6 Flare (fast)</option>
            <option value="gpt-image-2.6-sunburst">GPT Image 2.6 Sunburst (detailed)</option>
        </select>
    </div>

    <!-- Quality Dropdown -->
    <div class="form-group">
        <label for="quality" class="form-label">Quality:</label>
        <select id="quality" name="quality" class="form-input">
        </select>
    </div>
</div>

<script>
    const DEFAULT_IMAGE_MODEL = 'gpt-image-2.6-flare';
    const DEFAULT_QUALITY = 'medium';

    function toggleQualityDropdown(quality = "") {
        const qualityDropdown = document.getElementById("quality");
        const previous = quality || qualityDropdown.value;

        // Clear out old options
        qualityDropdown.innerHTML = "";

        // Low is the cheapest and usually plenty for an e-ink panel
        qualityDropdown.add(new Option("High", "high"));
        qualityDropdown.add(new Option("Medium", "medium"));
        qualityDropdown.add(new Option("Low (cheapest)", "low"));

        qualityDropdown.value = previous;
        if (!qualityDropdown.value) {
            qualityDropdown.value = DEFAULT_QUALITY;
        }
    }

    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        var imageModel = DEFAULT_IMAGE_MODEL;
        var quality = DEFAULT_QUALITY;

        if (loadPluginSettings) {
            document.getElementById('textPrompt').value = pluginSettings.textPrompt || '';

            imageModel = pluginSettings.imageModel || DEFAULT_IMAGE_MODEL;
            quality = pluginSettings.quality || DEFAULT_QUALITY;
        }

        const modelDropdown = document.getElementById('imageModel');
        modelDropdown.value = imageModel;
        if (!modelDropdown.value) {
            // Saved model was retired (e.g. gpt-image-1 / gpt-image-2)
            modelDropdown.value = DEFAULT_IMAGE_MODEL;
        }
        toggleQualityDropdown(quality);
    });
</script>
